<h2>New Product</h2>

<form class="form" [formGroup]="productForm" (ngSubmit)="onSave()">

  <label for="title"> Title: </label>
  <input id="title" type="text" formControlName="title" />
  <br>

  <label for="description"> Description: </label>
  <input id="description" type="text" formControlName="description" />
  <br>

  <div>
    <label>Photos:</label>
    <button type="button" (click)="addPhoto()"> Add photo </button>
  </div>
  <ng-container formArrayName="photos">
    <input type="text" *ngFor="let photo of photos.controls; let i=index" [formControlName]="i"/>
  </ng-container>
  <br>

  <div>
    <label>Prices:</label>
    <button type="button" (click)="addPrice()"> Add price </button>
  </div>
  <div formArrayName="prices">
    <div *ngFor="let price of prices.controls; let i=index" [formGroupName]="i">
      <label>
        Name:
        <input type="text" formControlName="key"/>
      </label>
      <label>
        Value:
        <input type="number" formControlName="value"/>
      </label>
    </div>
  </div>
  <br>

  <label for="offerDiscount"> Offer Discount: </label>
  <input id="offerDiscount" type="text" formControlName="offerDiscount" />
  <br>

  <button type="submit" class="add-button"> Save new product </button>
</form>

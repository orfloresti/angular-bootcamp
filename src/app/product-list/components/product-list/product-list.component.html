<div class="input-wrapper">
  <div class="input-area">
    <app-search-input></app-search-input>
  </div>
</div>
<div class="product-list-wrapper">
  <div class="product-width" *ngFor="let product of products">
    <app-product-card
      [prices]="product.prices"
      [photos]="product.photos"
      [title]="product.title"
      [description]="product.description"
      [id]="product.id"
    ></app-product-card>
  </div>

</div>

<div class="paginator-wapper">
  <app-paginator
    [itemsPerPage]="5"
    [results]="total"
    [currentPage]="page"
  ></app-paginator>
</div>
